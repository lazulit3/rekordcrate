[package]
name = "rekordcrate"
version = "0.3.0"
authors = ["Jan Holthuis <jan.holthuis@ruhr-uni-bochum.de>"]
description = "Library for parsing Pioneer Rekordbox device exports"
readme = "README.md"
repository = "https://github.com/Holzhaus/rekordcrate"
license = "MPL-2.0"
keywords = ["rekordbox", "dj", "export", "database", "parser"]
categories = ["parser-implementations"]
edition = "2021"
exclude = [".*"]

[dependencies]
binrw = "0.14"
modular-bitfield = "0.11"
crc16 = "0.4"
clap = { version = "4.5", features = ["derive"], optional = true }
parse-display = "0.10"
thiserror = "2.0"
quick-xml = { version = "0.37.2", features = ["serialize", "serde-types"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
# master-db
tempfile = { version = "3.10", optional = true }
sqlx = { version = "0.7", default-features = false, optional = true, features = [
    "runtime-tokio-rustls",
    "sqlite",
] }
# enables sqlcipher support with sqlx
libsqlite3-sys = { version = "0.27", optional = true, features = [
    "bundled-sqlcipher",
] }
tokio = { version = "1.0", optional = true, features = [
    "macros",
    "rt-multi-thread",
] }

[build-dependencies]
glob = "0.3"

[dev-dependencies]
pretty-hex = "0.4"
pretty_assertions = "1"

[features]
default = ["cli"]
master-db = ["sqlx", "tokio", "libsqlite3-sys", "tempfile"]
cli = ["dep:clap"]

[[bin]]
name = "rekordcrate"
required-features = ["cli"]
